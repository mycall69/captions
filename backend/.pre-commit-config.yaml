repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.12

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy app
        language: system
        types: [python]
        pass_filenames: false
