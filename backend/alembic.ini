# Alembic 설정 파일
# sqlalchemy.url은 env.py에서 Settings를 통해 동적으로 재정의된다.

[alembic]
script_location = app/infrastructure/db/migrations

# 마이그레이션 파일 이름 패턴: 0001_initial_schema.py 형식 권장
file_template = %%(rev)s_%%(slug)s

# 최대 파일명 길이
truncate_slug_length = 40

# 출력 인코딩
output_encoding = utf-8

# sqlalchemy.url 플레이스홀더 (env.py에서 Settings.database_url로 오버라이드)
sqlalchemy.url = sqlite:///./var/db/app.db

[post_write_hooks]
# 마이그레이션 파일 생성 후 ruff 자동 포맷 (선택)
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
