[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "captions-backend"
version = "0.1.0"
description = "Dual Subtitle MVP — FastAPI + Celery 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "structlog>=24.1",
    "anthropic>=0.28",
    "yt-dlp>=2024.5.1",
    "pysrt>=1.1",
    "webvtt-py>=0.5",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-celery>=1.0",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "types-redis>=4.6",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S110", "SIM105"]

# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.workers.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "integration: API + DB 통합 테스트",
  "workers: Celery 워커 태스크 테스트",
  "media: 미디어/자막 정렬 검증 테스트",
  "perf: 성능 검증 (SC-002 / SC-005 / SC-007)",
]
